name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web export
        working-directory: client
        env:
          EXPO_PUBLIC_API_URL: https://careerality.app
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_CLIENT_DSN }}
        run: |
          npm ci --legacy-peer-deps
          npm run web:build

      - name: Provision D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd server
          npm ci
          # wrangler.toml ships a placeholder database_id: resolve the real
          # id by name (creating the database on first run) and inject it,
          # so `d1 migrations apply` and `deploy` below target a real DB.
          # NOTE: plain table output is parsed instead of --json because some
          # runner-resolved wrangler versions reject the --json flag.
          D1_LS=$(./node_modules/.bin/wrangler d1 list 2>&1 || true)
          DB_ID=$(echo "$D1_LS" | grep -E '(^|[^a-z0-9-])careerality([^a-z0-9-]|$)' | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)
          if [ -z "$DB_ID" ]; then
            ./node_modules/.bin/wrangler d1 create careerality
            D1_LS=$(./node_modules/.bin/wrangler d1 list 2>&1 || true)
            DB_ID=$(echo "$D1_LS" | grep -E '(^|[^a-z0-9-])careerality([^a-z0-9-]|$)' | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)
          fi
          if [ -z "$DB_ID" ]; then
            echo "could not determine the careerality D1 database id"
            echo "$D1_LS"
            exit 1
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml

      - name: Deploy API worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci
          # Apply pending D1 migrations, then deploy. The Postgres seed
          # import (scripts/export_pg_to_sqlite.py + import_to_d1.sh) is a
          # one-time cutover step run manually, not on every deploy.
          ./node_modules/.bin/wrangler d1 migrations apply careerality --remote
          ./node_modules/.bin/wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            # Deploys with only custom-domain routes print no workers.dev
            # URL; fall back to the staging hostname for smoke checks.
            DEPLOY_URL="https://api-staging.careerality.app"
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed to $DEPLOY_URL"

      - name: Smoke-check API worker
        run: |
          set -euo pipefail
          echo "Checking $DEPLOY_URL"
          # grep into a variable first: `curl | grep -q` trips pipefail
          # (curl exits 23 on grep's early SIGPIPE close).
          body=$(curl --fail --silent --max-time 15 "$DEPLOY_URL/up")
          grep -q '"status":"ok"' <<<"$body"
          echo "Health check OK"
          body=$(curl --fail --silent --max-time 15 "$DEPLOY_URL/api/areas/states")
          grep -q '"states"' <<<"$body"
          echo "States OK"
          body=$(curl --fail --silent --max-time 15 "$DEPLOY_URL/api/roi?page=1&sort=demand")
          grep -q '"records"' <<<"$body"
          grep -q '"pagy"' <<<"$body"
          echo "ROI feed OK"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$DEPLOY_URL/api/nope")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for unknown route, got $code"
            exit 1
          fi
          echo "404 handling OK"

      - name: Deploy web to Pages
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy ../client/dist --project-name careerality-web
