name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build web export
        working-directory: client
        env:
          EXPO_PUBLIC_API_URL: https://careerality.app
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_CLIENT_DSN }}
        run: |
          npm ci --legacy-peer-deps
          npm run web:build

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          tar -C client/dist -cf - . | ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@$SERVER_HOST '
          set -euo pipefail
          cd /home/careerality/repo
          git pull --ff-only
          rm -rf server/public/app.next
          mkdir -p server/public/app.next
          tar -xf - -C server/public/app.next
          rm -rf server/public/app
          mv server/public/app.next server/public/app
          cd server
          bundle install
          SERVICE_ENV="$(systemctl show careerality --property=Environment --value)"
          env $SERVICE_ENV RAILS_ENV=production bundle exec rails db:migrate
          sudo systemctl restart careerality
          sudo systemctl is-active --quiet careerality
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              -H "Host: careerality.app" \
              http://127.0.0.1:3002/up; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          '
