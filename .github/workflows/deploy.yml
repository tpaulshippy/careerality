name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@$SERVER_HOST << 'EOF'
          set -euo pipefail
          cd /home/careerality/repo
          git pull
          cd server
          bundle install
          SERVICE_ENV="$(systemctl show careerality --property=Environment --value)"
          env $SERVICE_ENV RAILS_ENV=production bundle exec rails db:migrate
          sudo systemctl restart careerality
          sudo systemctl is-active --quiet careerality
          curl --fail --silent --show-error --max-time 15 \
            -H 'Host: careerality.app' \
            http://127.0.0.1:3002/up
          EOF
