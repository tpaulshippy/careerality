name: OTA Update

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  ota:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export and push OTA update
        working-directory: client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_PUBLIC_API_URL: https://careerality.app
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_CLIENT_DSN }}
        run: |
          rm -rf dist
          npx expo export --platform ios --no-bytecode --output-dir dist --clear
          fingerprint_output=$(npx eas fingerprint:generate --json --non-interactive --platform ios --environment production 2>/dev/null)
          current_runtime=$(printf '%s' "{${fingerprint_output#*\{}" | jq -r '.hash')
          build_runtime=$(npx eas build:list --platform ios --profile testflight --limit 10 --json | jq -r '(if type == "array" then . elif .currentPage then .currentPage elif .data then .data else [] end) | map(select((.status // "" | ascii_upcase) == "FINISHED")) | first | .runtimeVersion // empty')
          if [ -n "$build_runtime" ] && [ "$current_runtime" != "$build_runtime" ]; then
            echo "OTA runtime $current_runtime does not match the latest finished TestFlight build runtime $build_runtime"
            exit 1
          fi
          if [ -z "$build_runtime" ]; then
            echo "Unable to read a finished TestFlight build runtime; publishing without the compatibility check"
          fi
          npx eas update --channel testflight --environment production \
            --input-dir dist --skip-bundler \
            --message "Automatic OTA from ${{ github.event.workflow_run.head_commit.message || github.event.workflow_run.head_sha }}"
