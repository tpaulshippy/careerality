name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  data-scripts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # The content-generation scripts are not part of either app bundle, so nothing
      # else in CI parses them. A syntax error here would only surface when someone
      # runs the pipeline. Check every file and report all failures rather than
      # stopping at the first, and fail loudly if the glob matches nothing.
      - name: Syntax check scripts
        run: |
          set +e
          shopt -s nullglob
          files=(content_generation/*.rb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Ruby scripts found to check"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            ruby -c "$f" > /dev/null || { echo "syntax error: $f"; status=1; }
          done
          exit $status

      # Globbed so a newly added *_test.rb is never silently skipped.
      - name: Run unit tests
        run: |
          set +e
          shopt -s nullglob
          tests=(content_generation/*_test.rb)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No unit tests found"
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            ruby "$t" || status=1
          done
          exit $status

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web export
        env:
          EXPO_PUBLIC_API_URL: https://careerality.app
        run: npm run web:build
